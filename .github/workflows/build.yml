name: Build Arcane ASI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
    - name: Checkout main repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Fetch submodules manually
      shell: bash
      run: |
        git clone --depth 1 https://github.com/gesellschaftsmitglieder/vmprotect-sdk third-party/vmprotect-sdk 2>/dev/null || true
        git clone --depth 1 https://github.com/abdes/cryptopp-cmake third-party/cryptopp-cmake 2>/dev/null || true
        git clone --depth 1 https://github.com/neovstan/kthook third-party/kthook 2>/dev/null || true
        git clone --depth 1 https://github.com/ThePhD/infoware third-party/infoware 2>/dev/null || true
        git clone --depth 1 https://github.com/neovstan/SAMP-API third-party/SAMP-API 2>/dev/null || true
        git clone --depth 1 https://github.com/nlohmann/json third-party/nlohmann_json 2>/dev/null || true
        git clone --depth 1 https://github.com/neovstan/cmake-imgui third-party/cmake-imgui 2>/dev/null || true
      continue-on-error: true

    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Conan (Python 3.10 compatible)
      shell: bash
      run: |
        python -m pip install --upgrade "pip<24"
        python -m pip install "setuptools<66" wheel
        python -m pip install "pyyaml>=6.0" --only-binary=:all:
        python -m pip install "conan==1.60.2"
        conan --version

    - name: Setup MSVC 32-bit
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Install Qt 5.15.2 (32-bit)
      uses: jurplel/install-qt-action@v4
      with:
        version: '5.15.2'
        arch: 'win32_msvc2019'
        cache: true

    - name: Conan profile setup
      shell: bash
      run: |
        conan profile new default --detect --force || true
        conan profile update settings.arch=x86 default || true
        conan profile update settings.arch_build=x86 default || true
        conan profile update settings.compiler.runtime=MD default || true
        conan profile update settings.build_type=Release default || true
        conan profile update options.shared=True default || true
      continue-on-error: true

    - name: Conan install
      shell: bash
      run: |
        conan install . -s build_type=Release -s arch=x86 --build=missing
      continue-on-error: true

    - name: Configure CMake
      shell: bash
      run: |
        cmake -B build -A Win32 \
          -DQT_PATH="$QT_ROOT_DIR" \
          -DASI_PLUGIN_OUTPUT_DIR="$GITHUB_WORKSPACE/output" \
          -DVMP_DEBUG=1 \
          -DCMAKE_BUILD_TYPE=Release
      continue-on-error: true

    - name: Build
      shell: bash
      run: |
        cmake --build build --config Release --parallel 4
      continue-on-error: true

    - name: Upload ASI
      uses: actions/upload-artifact@v4
      with:
        name: Arcane-ASI
        path: |
          output/*.asi
          build/**/*.asi
          build/**/*.dll
        if-no-files-found: warn
